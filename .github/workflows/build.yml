name: ASTROML Build & Release

on:
  push:
    branches: [master, main]
    tags:
      - "v*"
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter info
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Determine release version
        id: version
        shell: bash
        run: |
          PUBSPEC_VERSION="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          PUBSPEC_BUILD="${PUBSPEC_VERSION##*+}"
          PUBSPEC_NAME="${PUBSPEC_VERSION%%+*}"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RELEASE_VERSION="${GITHUB_REF#refs/tags/v}"
          else
            RELEASE_VERSION="$PUBSPEC_NAME"
          fi

          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version in tag: $RELEASE_VERSION" >&2
            exit 1
          fi

          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=${PUBSPEC_BUILD:-1}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Configure release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
            cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          else
            echo "No signing secrets set; release APKs will use debug signing."
          fi

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build split APKs (ARM32 and ARM64)
        run: >-
          flutter build apk --release --split-per-abi
          --build-name=${{ steps.version.outputs.version }}
          --build-number=${{ steps.version.outputs.build_number }}

      - name: Build universal APK
        run: >-
          flutter build apk --release
          --build-name=${{ steps.version.outputs.version }}
          --build-number=${{ steps.version.outputs.build_number }}

      - name: Prepare release APKs
        id: package
        shell: bash
        run: |
          OUT="build/app/outputs/flutter-apk"
          VERSION="${{ steps.version.outputs.version }}"

          test -f "$OUT/app-armeabi-v7a-release.apk"
          test -f "$OUT/app-arm64-v8a-release.apk"
          test -f "$OUT/app-release.apk"

          cp "$OUT/app-armeabi-v7a-release.apk" "$OUT/ASTROML-${VERSION}-arm32.apk"
          cp "$OUT/app-arm64-v8a-release.apk" "$OUT/ASTROML-${VERSION}-arm64.apk"
          cp "$OUT/app-release.apk" "$OUT/ASTROML-${VERSION}-universal.apk"

          ls -lh "$OUT"/ASTROML-*.apk

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ASTROML-${{ steps.version.outputs.version }}-APKs
          path: build/app/outputs/flutter-apk/ASTROML-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.version }}
          body: |
            ## ASTROML ${{ steps.version.outputs.version }}

            Developer: **Astro Renz**

            ### Downloads
            - **ARM32** — for 32-bit ARM devices.
            - **ARM64** — for 64-bit ARM devices.
            - **Universal** — APK containing Flutter's supported target ABIs in one package.

            Install the APK that matches your device. The universal APK is the compatibility option if you are unsure.

            ### Update notes and screenshots
            Edit this release description to add notes. ASTROML Settings can display up to two images from Markdown image links using public HTTPS URLs.

            ### Update notes and screenshots
            Add release notes below. To show up to two screenshots in ASTROML Settings > Check for updates, add image Markdown using publicly accessible HTTPS image URLs:
            `![Screenshot 1](https://example.com/screenshot-1.png)`
            `![Screenshot 2](https://example.com/screenshot-2.png)`
          files: |
            build/app/outputs/flutter-apk/ASTROML-${{ steps.version.outputs.version }}-arm32.apk
            build/app/outputs/flutter-apk/ASTROML-${{ steps.version.outputs.version }}-arm64.apk
            build/app/outputs/flutter-apk/ASTROML-${{ steps.version.outputs.version }}-universal.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
